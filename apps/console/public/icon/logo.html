<title>FIT&LOOK Animation</title>
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #fff;
  }

  .logo-wrap {
    width: 740px;
    max-width: 95vw;
  }

  .letter { opacity: 0; }
  .letter-F  { animation: fadeUp 0.4s ease forwards 0.1s; }
  .letter-I  { animation: fadeUp 0.4s ease forwards 0.25s; }
  .letter-T  { animation: fadeUp 0.4s ease forwards 0.4s; }
  .letter-amp{ animation: fadeUp 0.4s ease forwards 0.55s; }
  .letter-L  { animation: fadeUp 0.4s ease forwards 0.7s; }
  .letter-O  { animation: fadeUp 0.4s ease forwards 0.85s; }
  .letter-O2 { animation: fadeUp 0.4s ease forwards 1.0s; }
  .letter-K  { animation: fadeUp 0.4s ease forwards 1.15s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .orange-dot {
    opacity: 0;
    animation: fadeIn 0.6s ease forwards 1.4s;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
