<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FIT&amp;LOOK デモ（PC 右下パネル）</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f4f4f5;
      }
      .hint {
        position: fixed;
        left: 16px;
        top: 16px;
        max-width: min(420px, calc(100vw - 32px));
        font: 13px/1.5 system-ui, sans-serif;
        color: #52525b;
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        padding: 12px 14px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .hint code {
        font-size: 0.9em;
        background: #f4f4f5;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <p class="hint">
      ほぼ空のページです。<code>data-fitlook-desktop-panel="true"</code> または URL に
      <code>?fitlook-desktop-panel=true</code> があるときだけ右下パネル用にオプトインします（レイアウトはウィジェット側 JS）。本番 EC
      では属性もクエリも付けず、従来どおり全画面試着になります。キーと商品 ID を差し替えてください。
    </p>

    <div
      data-fitlook-public-key="YOUR_PUBLIC_KEY"
      data-fitlook-external-product-id="YOUR_EXTERNAL_PRODUCT_ID"
      data-fitlook-desktop-panel="true"
      data-fitlook-auto-open="true"
    ></div>

    <script async src="/widget.js"></script>
  </body>
</html>
