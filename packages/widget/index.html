<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier Widget</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ececec;
      color: #1a1a1a;
      padding: 24px;
      box-sizing: border-box;
    }
    .box {
      max-width: 420px;
      background: #fff;
      padding: 28px 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      line-height: 1.6;
      font-size: 15px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 600;
    }
    p {
      margin: 0 0 14px;
      color: #444;
    }
    a {
      color: #0f766e;
      font-weight: 600;
    }
    code {
      font-size: 13px;
      background: #f4f4f5;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>試着プレビューはコンソールで</h1>
    <p>
      以前のデモ一覧ページは廃止しました。端末枠つきのプレビュー（<code>PreviewPanel</code>）は次の手順で開けます。
    </p>
    <p>
      別ターミナルで <code>npm run dev:console</code> を起動し、ブラウザで
      <a href="http://localhost:3000/database/products" target="_blank" rel="noopener noreferrer"
        >http://localhost:3000/database/products</a
      >
      を開く → 商品を選び、プレビューを表示してください。
    </p>
    <p style="margin-bottom: 0; font-size: 13px; color: #71717a">
      この <code>npm run dev:widget</code> は Vite のビルド確認用です。バンドル出力は <code>npm run build:widget</code>（<code>dist/widget.iife.js</code>）。
    </p>
  </div>
</body>
</html>
