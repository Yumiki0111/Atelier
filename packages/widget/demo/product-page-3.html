<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レザージャケット - アパレルECサイト</title>
  <link rel="stylesheet" href="product-page.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="index.html" class="logo">ATELIER</a>
      <nav class="nav">
        <a href="index.html">ホーム</a>
        <a href="index.html">商品一覧</a>
        <a href="index.html">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">ホーム</a> / 
      <a href="index.html">ジャケット</a> / 
      レザージャケット
    </div>

    <div class="product-container">
      <div class="product-image">
        <!-- Widget埋め込み: 商品画像エリアに3Dキューブを表示 -->
        <div
          data-atelier-shop-id="00000000-0000-0000-0000-000000000001"
          data-atelier-handle="leather-jacket"
          style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
        </div>
      </div>

      <div class="product-info">
        <h1>レザージャケット</h1>
        <div class="product-brand">ATELIER BRAND</div>
        <div class="product-price">¥28,000</div>
        
        <div class="product-description">
          本革を使用したレザージャケットです。上質な素材と職人の技術が光る、長く愛用できるアイテムです。
        </div>

        <div class="widget-section">
          <h3>3D試着</h3>
          <p style="font-size: 14px; color: #666; margin-bottom: 12px;">
            キューブをクリックして、実際のサイズ感を3Dで確認できます
          </p>
          <div class="widget-container">
            <div
              data-atelier-shop-id="00000000-0000-0000-0000-000000000001"
              data-atelier-handle="leather-jacket">
            </div>
          </div>
        </div>

        <button class="add-to-cart" onclick="alert('カートに追加しました')">
          カートに追加
        </button>
      </div>
    </div>

    <div class="product-details">
      <h2>商品詳細</h2>
      <table>
        <tr>
          <td>素材</td>
          <td>本革 100%</td>
        </tr>
        <tr>
          <td>サイズ</td>
          <td>S, M, L</td>
        </tr>
        <tr>
          <td>カラー</td>
          <td>ブラック</td>
        </tr>
        <tr>
          <td>原産国</td>
          <td>日本</td>
        </tr>
      </table>
    </div>
  </div>

  <script type="module">
    try {
      console.log('[Demo Page] Starting widget initialization...');
      const { initWidget } = await import('../src/widget.ts');
      console.log('[Demo Page] Widget module loaded');
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          console.log('[Demo Page] DOM loaded, initializing widget...');
          initWidget();
        });
      } else {
        console.log('[Demo Page] DOM already loaded, initializing widget...');
        initWidget();
      }
    } catch (error) {
      console.error('[Demo Page] Error loading widget:', error);
    }
  </script>
</body>
</html>
