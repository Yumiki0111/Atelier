<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ウールコート - アパレルECサイト</title>
  <link rel="stylesheet" href="product-page.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="index.html" class="logo">ATELIER</a>
      <nav class="nav">
        <a href="index.html">ホーム</a>
        <a href="index.html">商品一覧</a>
        <a href="index.html">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">ホーム</a> / 
      <a href="index.html">コート</a> / 
      ウールコート
    </div>

    <div class="product-container">
      <div class="product-image">
        <!-- Widget埋め込み: 商品画像エリアに3Dキューブを表示 -->
        <!-- ウールコートのexternal_product_idを使用 -->
        <div
          data-atelier-public-key="pub_live_030b64caa84e2995672163c125d600bd"
          data-atelier-external-product-id="a6b494eb-a68a-45af-b868-9eb9ac03add7"
          style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
        </div>
      </div>

      <div class="product-info">
        <h1>ウールコート</h1>
        <div class="product-brand">ATELIER BRAND</div>
        <div class="product-price">¥35,000</div>
        
        <div class="product-description">
          上質なウール素材を使用したコートです。保温性と通気性に優れ、秋冬のシーズンに最適なアイテムです。
        </div>

        <div class="widget-section">
          <h3>3D試着</h3>
          <p style="font-size: 14px; color: #666; margin-bottom: 12px;">
            キューブをクリックして、実際のサイズ感を3Dで確認できます
          </p>
          <div class="widget-container">
            <!-- ウールコートのexternal_product_idを使用 -->
            <div
              data-atelier-public-key="pub_live_030b64caa84e2995672163c125d600bd"
              data-atelier-external-product-id="a6b494eb-a68a-45af-b868-9eb9ac03add7">
            </div>
          </div>
        </div>

        <button class="add-to-cart" onclick="alert('カートに追加しました')">
          カートに追加
        </button>
      </div>
    </div>

    <div class="product-details">
      <h2>商品詳細</h2>
      <table>
        <tr>
          <td>素材</td>
          <td>ウール 100%</td>
        </tr>
        <tr>
          <td>サイズ</td>
          <td>S, M, L</td>
        </tr>
        <tr>
          <td>カラー</td>
          <td>ベージュ</td>
        </tr>
        <tr>
          <td>原産国</td>
          <td>日本</td>
        </tr>
      </table>
    </div>
  </div>

  <script type="module">
    try {
      console.log('[Demo Page] Starting widget initialization...');
      const { initWidget } = await import('../src/widget.ts');
      console.log('[Demo Page] Widget module loaded');
      
      // DOMが完全に読み込まれた後に初期化
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          console.log('[Demo Page] DOM loaded, initializing widget...');
          initWidget();
        });
      } else {
        // DOMが既に読み込まれている場合は即座に初期化
        console.log('[Demo Page] DOM already loaded, initializing widget...');
        initWidget();
      }
    } catch (error) {
      console.error('[Demo Page] Error loading widget:', error);
    }
  </script>
</body>
</html>
