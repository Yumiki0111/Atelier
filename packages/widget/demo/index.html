<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品一覧 - アパレルECサイト</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #333;
      line-height: 1.6;
      background: #f5f5f5;
    }
    
    .header {
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #000;
      text-decoration: none;
    }
    
    .nav {
      display: flex;
      gap: 24px;
    }
    
    .nav a {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
    
    .nav a:hover {
      color: #000;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    .page-title {
      font-size: 32px;
      margin-bottom: 32px;
      font-weight: 600;
    }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 32px;
    }
    
    .product-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    
    .product-image {
      width: 100%;
      aspect-ratio: 1;
      background: #f9f9f9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }
    
    .product-info {
      padding: 20px;
    }
    
    .product-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .product-brand {
      color: #666;
      font-size: 14px;
      margin-bottom: 12px;
    }
    
    .product-price {
      font-size: 24px;
      font-weight: bold;
      color: #000;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="index.html" class="logo">ATELIER</a>
      <nav class="nav">
        <a href="index.html">ホーム</a>
        <a href="index.html">商品一覧</a>
        <a href="index.html">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">商品一覧</h1>
    
    <div class="products-grid">
      <a href="product-page-2.html" class="product-card">
        <div class="product-image">商品画像</div>
        <div class="product-info">
          <div class="product-name">ダブルジャケット</div>
          <div class="product-brand">ATELIER BRAND</div>
          <div class="product-price">¥15,800</div>
        </div>
      </a>
      
      <a href="product-page-4.html" class="product-card">
        <div class="product-image">商品画像</div>
        <div class="product-info">
          <div class="product-name">ウールコート</div>
          <div class="product-brand">ATELIER BRAND</div>
          <div class="product-price">¥35,000</div>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
